<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
}

/* 🎥 Video Background */
#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* 🌑 Dark Overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

/* 📦 Center Content */
.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ✨ Glass Button */
button{
    padding:16px 40px;
    font-size:20px;
    font-weight:bold;

    color:white;

    border:1px solid rgba(255,255,255,0.3);
    border-radius:50px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);

    cursor:pointer;

    transition:all 0.3s ease;

    box-shadow:0 0 20px rgba(255,255,255,0.15);
}

button:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,0.25);
}

/* 🚀 Slide Animation */
.page{
    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:transform .7s ease, opacity .7s ease;
}

.slide-out{
    transform:translateX(-100%);
    opacity:0;
}

</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
    <source src="assets/videos/fire.mp4" type="video/mp4">
</video>

<div class="page" id="page">

    <div class="container">

        <button onclick="goToSurprise()">
            ✨ Click here ✨
        </button>

    </div>

</div>

<script>
function goToSurprise(){

    document
        .getElementById("page")
        .classList
        .add("slide-out");

    setTimeout(()=>{
        window.location.href="surprise.html";
    },700);

}
</script>

</body>
</html>
